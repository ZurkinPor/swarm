[package]
name = "swarm"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
anyhow = "1"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures = "0.3"
